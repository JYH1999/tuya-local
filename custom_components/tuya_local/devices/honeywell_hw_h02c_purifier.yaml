name: Purifier
products:
  - id: 3jlafnyqdudrhbkn
    manufacturer: Honeywell
    model: HW-H02C
entities:
  - entity: fan
    translation_key: air_purifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 4
        type: string
        name: speed
        mapping:
          - dps_val: "1"
            value: 33
          - dps_val: "2"
            value: 66
          - dps_val: "3"
            value: 100
      - id: 105
        type: boolean
        name: preset_mode
        mapping:
          - dps_val: true
            value: auto
          - dps_val: false
            value: manual
  - entity: sensor
    class: pm25
    dps:
      - id: 2
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: sensor
    translation_key: filter_life
    dps:
      - id: 5
        type: integer
        name: sensor
        unit: "%"
        mapping:
          - scale: 100
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 101
        type: boolean
        name: lock
  - entity: light
    translation_key: ambient_light
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: switch
    translation_key: sleep
    dps:
      - id: 104
        type: boolean
        name: switch
